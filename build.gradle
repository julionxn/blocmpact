plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.10.0'
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"blocmpact" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("THIRD_PARTY_NOTICES.md") {
		rename { "THIRD_PARTY_NOTICES_${projectName}.md" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
			pom {
				name = "Blocmpact"
				description = "Style-neutral visual effects API for Minecraft (Fabric)."
				url = "https://github.com/julionxn/blocmpact"
				licenses {
					license {
						name = "MIT"
						url = "https://opensource.org/license/mit"
					}
				}
			}
		}
	}
}

// The CHANGELOG.md section of this version ("## <version>" up to the next "## ").
def changelogSection = {
	def lines = file("CHANGELOG.md").readLines("UTF-8")
	def start = lines.findIndexOf { it.startsWith("## ${project.version}") }
	if (start < 0) return ""
	def end = lines.findIndexOf(start + 1) { it.startsWith("## ") }
	return lines.subList(start + 1, end < 0 ? lines.size() : end).join("\n").trim()
}

// ./gradlew modrinth (MODRINTH_TOKEN set) uploads this version; the release workflow does it for each tag.
modrinth {
	token = providers.environmentVariable("MODRINTH_TOKEN")
	projectId = project.modrinth_project
	versionNumber = project.version.toString()
	versionName = "Blocmpact ${project.version}"
	versionType = "release"
	changelog = changelogSection()
	uploadFile = jar
	additionalFiles = [sourcesJar]
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	dependencies {
		required.project "fabric-api"
	}
}
